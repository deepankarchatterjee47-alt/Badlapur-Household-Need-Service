name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"
          
          if [ -z "$JAVA_HOME" ]; then
            echo "Error: JAVA_HOME is not set."
            exit 1
          fi
          
          JAVA_VERSION_OUTPUT=$(java -version 2>&1)
          JAVA_MAJOR=$(echo "$JAVA_VERSION_OUTPUT" | awk -F '"' '/version/ {print $2}' | awk -F. '{if ($1 == "1") print $2; else print $1}')
          
          if [ -z "$JAVA_MAJOR" ]; then
            echo "Error: Could not detect the active Java major version."
            exit 1
          fi
          
          echo "Detected Java major version: $JAVA_MAJOR"
          
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Active Java major version is $JAVA_MAJOR, which is lower than the required version 17."
            exit 1
          fi
          
          echo "Java 17 or newer verified successfully."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "debug.keystore is missing. Generating temporary debug keystore..."
            keytool -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          if [ ! -f "./debug.keystore" ]; then
            echo "Error: Failed to create or locate ./debug.keystore."
            exit 1
          fi
          
          echo "Temporary debug keystore verified."

      - name: Build the debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: Expected debug APK was not found at $EXPECTED_APK."
            echo "Searching only inside app/build/outputs/apk for discovered APKs:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk" -print
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is not a regular file."
            exit 1
          fi
          
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "Error: $EXPECTED_APK is empty."
            exit 1
          fi
          
          case "$EXPECTED_APK" in
            *.apk) ;;
            *) echo "Error: $EXPECTED_APK does not have the .apk extension."; exit 1 ;;
          esac
          
          echo "Verified exact expected APK: $EXPECTED_APK"
          ls -lh "$EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          
          TEMP_RELEASE_DIR=$(mktemp -d -t release-asset-XXXXXX)
          
          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SANITIZED_REPO=$(echo "$RAW_REPO_NAME" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9' '-' | sed 's/^-//;s/-$//')
          if [ -z "$SANITIZED_REPO" ]; then
            SANITIZED_REPO="app"
          fi
          
          RELEASE_ASSET_NAME="${SANITIZED_REPO}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          DEST_ASSET_PATH="${TEMP_RELEASE_DIR}/${RELEASE_ASSET_NAME}"
          
          cp "$SOURCE_APK" "$DEST_ASSET_PATH"
          
          if [ ! -s "$DEST_ASSET_PATH" ]; then
            echo "Error: Failed to prepare non-empty release asset at $DEST_ASSET_PATH"
            exit 1
          fi
          
          echo "Prepared release asset: $DEST_ASSET_PATH ($RELEASE_ASSET_NAME)"
          echo "asset_path=$DEST_ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$RELEASE_ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          
          if [ ! -f "$ASSET_PATH" ]; then
            echo "Error: Release asset does not exist at $ASSET_PATH"
            exit 1
          fi
          
          if [ ! -s "$ASSET_PATH" ]; then
            echo "Error: Release asset at $ASSET_PATH is empty"
            exit 1
          fi
          
          case "$ASSET_PATH" in
            *.apk) ;;
            *) echo "Error: Release asset $ASSET_PATH does not have .apk extension"; exit 1 ;;
          esac
          
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          
          NOTES_FILE=$(mktemp)
          cat <<EOF > "$NOTES_FILE"
          ### Debug APK Build #${GITHUB_RUN_NUMBER}
          
          - **Build Type:** Automatically generated debug APK
          - **Builder:** GitHub Actions
          - **Run Number:** ${GITHUB_RUN_NUMBER}
          - **Run Attempt:** ${GITHUB_RUN_ATTEMPT}
          - **Source Commit SHA:** ${GITHUB_SHA}
          - **Notice:** This APK is intended for testing and development.
          - **Target:** Not a Play Store production release.
          - **Signing:** Signed only with a temporary debug keystore.
          
          Download the attached **${ASSET_NAME}** below to install directly on your Android device.
          EOF
          
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --latest
          
          rm -f "$NOTES_FILE"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_STATUS="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          
          if [ "$RELEASE_STATUS" = "success" ]; then
            echo "=== GitHub Release Publishing Succeeded ==="
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Asset Filename: $ASSET_NAME"
            
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq .url 2>/dev/null || echo "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}")
            echo "Release URL: $RELEASE_URL"
            
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
            ## :white_check_mark: Debug APK Build & Release Succeeded!
            
            - **Release Title:** ${RELEASE_TITLE}
            - **Release Tag:** \`${RELEASE_TAG}\`
            - **Downloadable APK:** [\`${ASSET_NAME}\`](${RELEASE_URL})
            - **Direct GitHub Release Page:** [View Release](${RELEASE_URL})
            
            You can download the APK file directly on your phone from the **Assets** section of the release page above.
            
            > **Backup Artifact:** The standard GitHub Actions artifact named \`app-debug-apk\` is also available at the bottom of this summary page.
            EOF
          else
            echo "=== WARNING: GitHub Release Publishing Failed or Skipped ==="
            echo "The debug APK build and artifact upload completed successfully."
            echo "The Actions artifact 'app-debug-apk' remains available for direct download."
            
            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
            ## :warning: Debug APK Build Succeeded (Release Publishing Failed/Skipped)
            
            - **APK Build Status:** Successful
            - **Artifact Status:** Uploaded as \`app-debug-apk\`
            
            Release publishing encountered an issue or was skipped, but your debug APK was successfully built.
            You can download the APK immediately from the **Artifacts** section at the bottom of this workflow run page.
            EOF
          fi
